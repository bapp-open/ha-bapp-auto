update_mileage:
  fields:
    device_id:
      required: true
      selector:
        device:
          multiple: true
          filter:
            integration: bapp_auto
    mileage:
      required: true
      example: 123456
      selector:
        number:
          min: 0
          max: 5000000
          step: 1
          mode: box
          unit_of_measurement: km

refresh:
  fields:
    device_id:
      required: false
      selector:
        device:
          multiple: true
          filter:
            integration: bapp_auto
